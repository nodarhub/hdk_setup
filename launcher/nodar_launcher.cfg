# nodar_launcher.cfg — Nodar Launcher configuration
#
# This file controls which commands the launcher runs for each action.
# Values are shell-quoted strings; arguments are supported.
#
# The launcher reads config from two locations (later overrides earlier):
#   1.  nodar_launcher.cfg  next to nodar_launcher.py  (dev / source-tree use)
#   2.  ~/.config/nodar/nodar_launcher.cfg              (primary for Orin deployment)
#
# If neither file exists, built-in defaults (installed .deb binaries) are used.
#
# ──────────────────────────────────────────────────────────────────────────────
# DEPLOYMENT EXAMPLES
# ──────────────────────────────────────────────────────────────────────────────
#
# 1.  Orin / Ubuntu with installed .deb packages
#     (hammerhead and nodar_viewer are on PATH)
#
#     [commands]
#     hammerhead   = hammerhead
#     nodar_viewer = nodar_viewer
#
#
# 2.  Custom arguments  (e.g. force a specific config directory)
#
#     [commands]
#     hammerhead   = hammerhead --config /etc/nodar/config
#     nodar_viewer = nodar_viewer
#
# ──────────────────────────────────────────────────────────────────────────────
# ACTIVE CONFIGURATION  (edit below)
# ──────────────────────────────────────────────────────────────────────────────

[commands]

# Command to launch Hammerhead (used for both "with viewer" and "headless")
hammerhead   = hammerhead

# Command to launch nodar_viewer (started in the background alongside Hammerhead)
nodar_viewer = nodar_viewer

# Path to config path.
config_path = ~/.config/nodar/config/
